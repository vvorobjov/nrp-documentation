# EBR2-52 — docs CI on GitHub Actions.
#
# Replaces the Jenkins/Nexus pipeline (see Jenkinsfile, kept as a
# reference for the legacy Bitbucket-side deploy) with a workflow
# that builds the Sphinx HTML and publishes it to GitHub Pages from
# the canonical vvorobjov/nrp-documentation repository.
#
# Build path:
#   1. .ci/get-nrp-core-docs.py  — pulls nrp-core-docs.zip from the
#      GitHub Release configured in the script (EBR2-50). Best-effort:
#      that asset is not published yet, so a failed fetch only drops the
#      nrp-core API section (toctree warning) instead of failing the job.
#   2. unzip into src/nrp-core/  — same target as the Makefile's
#      ``nrp-core-unzip`` recipe.
#   3. sphinx-build -b html src _build/html — runs the same builder
#      the Makefile's ``doc`` target invokes, just without the HBP-
#      shaped wrapper (user_makefile, platform_venv, nrp-backend doc
#      copy). Missing nrp-backend toctree entries surface as warnings
#      but do not fail the build; the retired Jenkins job used to
#      produce the full multi-repo docs.
#
# Before the first master push, enable Pages with source "GitHub Actions"
# in the repo settings: actions/deploy-pages fails until the site exists.

name: docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run at a time per ref: master runs (and thus Pages deployments)
# serialise without cancelling an in-flight deploy, while pull_request
# runs get their own group and cannot displace a pending master deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # `git describe --tags` in the Makefile's VERSION

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .ci/requirements_docs.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .ci/requirements_docs.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip

      - name: Fetch nrp-core API docs zip
        continue-on-error: true
        env:
          # Leave unset to use DEFAULT_URL inside the script. Override
          # via the repo's Actions variables if the source-of-truth
          # moves before the script default is updated.
          NRP_CORE_DOCS_URL: ${{ vars.NRP_CORE_DOCS_URL }}
        run: python3 .ci/get-nrp-core-docs.py

      - name: Unpack nrp-core docs
        if: hashFiles('nrp-core-docs.zip') != ''
        run: |
          mkdir -p src/nrp-core
          unzip -o -q nrp-core-docs.zip -d src/nrp-core/

      - name: Flag the omitted nrp-core API section
        if: hashFiles('nrp-core-docs.zip') == ''
        run: echo "::warning::nrp-core-docs.zip was not fetched; the nrp-core API section is omitted from this build"

      - name: Compute version string
        id: version
        run: |
          v="$(git describe --tags --always --abbrev=0 2>/dev/null || echo 0.0.0)-${GITHUB_RUN_NUMBER}"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "${v}" > version

      - name: Build HTML with Sphinx
        run: |
          sphinx-build -b html \
            -t fulldocs \
            -D version="${{ steps.version.outputs.version }}" \
            -D release="${{ steps.version.outputs.version }}" \
            -d _build/doctrees \
            -w sphinx_w.txt \
            src _build/html

      - name: Surface Sphinx warnings
        if: always()
        run: |
          if [ -s sphinx_w.txt ]; then
            echo "::group::sphinx_w.txt"
            cat sphinx_w.txt
            echo "::endgroup::"
          else
            echo "no sphinx warnings"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
